<svg viewBox="0 0 600 966" xmlns="http://www.w3.org/2000/svg">
<defs>
  <radialGradient id="bg" cx="50%" cy="34%" r="95%">
    <stop offset="0%" stop-color="#1d3524"/><stop offset="52%" stop-color="#0f1a12"/>
    <stop offset="100%" stop-color="#070c08"/>
  </radialGradient>
</defs>
<rect width="600" height="966" fill="url(#bg)"/>

<text x="300" y="128" text-anchor="middle" font-family="Georgia, serif"
      font-weight="bold" font-size="27" letter-spacing="3" fill="#f2f5ee">THE KITCHEN GARDEN</text>
<text x="300" y="152" text-anchor="middle" font-family="Georgia, serif" font-size="11" letter-spacing="6" fill="#9fbfa4">VOLUME ONE</text>
<g stroke="#3f6b44" stroke-width="1.1"><line x1="196" y1="174" x2="284" y2="174"/><line x1="316" y1="174" x2="404" y2="174"/></g>
<path d="M300,170 L304,174 L300,178 L296,174 Z" fill="#d6b25e"/>

<g text-anchor="middle" font-family="Georgia, serif" fill="#e8eee3">
  <text x="300" y="240" font-size="18">Four square metres, dug in a cold spring,</text>
  <text x="300" y="266" font-size="18">and one season spent in them.</text>
</g>

<g text-anchor="middle" font-family="Georgia, serif" font-size="14.5" fill="#b6c8b4">
  <text x="300" y="330">The turf came off in strips and went back upside down at the</text>
  <text x="300" y="352">bottom of the trench, where it rots out of the light and feeds</text>
  <text x="300" y="374">what is planted above it. That was the second week of March.</text>
</g>

<g text-anchor="middle" font-family="Georgia, serif" font-size="14.5" fill="#e8eee3">
  <text x="300" y="430">What went in, in what order, and on what date. What came up.</text>
  <text x="300" y="452">What did not, and the best guess as to why. The three things</text>
  <text x="300" y="474">a single small bed can actually teach in a single season —</text>
  <text x="300" y="496">only one of which was a surprise.</text>
</g>

<text x="300" y="560" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#d6b25e">A bed you can reach across is a bed you will</text>
<text x="300" y="582" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#d6b25e">actually weed.</text>

<g text-anchor="middle" font-family="Georgia, serif">
  <text x="300" y="812" font-size="11" letter-spacing="4" fill="#9fbfa4">WORKING NOTES</text>
  <text x="300" y="832" font-size="11" letter-spacing="4" fill="#6f8a72">EXAMPLE PRESS</text>
</g>
<text x="300" y="880" text-anchor="middle" font-family="Georgia, serif" font-size="10.5" fill="#6f8a72">An example book, included so the engine has something to build.</text>

<rect x="20" y="53" width="560" height="860" fill="none" stroke="#3f6b44" stroke-width="1.3" opacity="0.9"/>
<rect x="26" y="59" width="548" height="848" fill="none" stroke="#3f6b44" stroke-width="0.6" opacity="0.55"/>
</svg>
