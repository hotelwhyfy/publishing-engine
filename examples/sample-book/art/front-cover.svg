<svg viewBox="0 0 600 966" xmlns="http://www.w3.org/2000/svg">
<defs>
  <radialGradient id="bg" cx="50%" cy="34%" r="95%">
    <stop offset="0%" stop-color="#1d3524"/><stop offset="52%" stop-color="#0f1a12"/>
    <stop offset="100%" stop-color="#070c08"/>
  </radialGradient>
  <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#3f6b44"/><stop offset="50%" stop-color="#d6b25e"/>
    <stop offset="100%" stop-color="#3f6b44"/>
  </linearGradient>
</defs>
<rect width="600" height="966" fill="url(#bg)"/>

<text x="300" y="140" text-anchor="middle" font-family="Georgia, serif"
      font-size="12" letter-spacing="5" fill="#9fbfa4">NOTES ON A SMALL BED</text>

<text x="300" y="248" text-anchor="middle" font-family="Georgia, serif"
      font-weight="bold" font-size="46" letter-spacing="5" fill="#f2f5ee">THE KITCHEN</text>
<text x="300" y="306" text-anchor="middle" font-family="Georgia, serif"
      font-weight="bold" font-size="46" letter-spacing="5" fill="#f2f5ee">GARDEN</text>
<rect x="200" y="330" width="200" height="4" rx="2" fill="url(#rule)"/>
<text x="300" y="368" text-anchor="middle" font-family="Georgia, serif" font-size="15.5" fill="#c3d4c1">Four square metres, and one season in them.</text>

<!-- the bed, seen from above, with its four paths -->
<g fill="none" stroke="#d6b25e" stroke-width="1.6">
  <rect x="200" y="470" width="200" height="200"/>
  <rect x="176" y="446" width="248" height="248" stroke="#3f6b44" stroke-width="1.1"/>
</g>
<g stroke="#3f6b44" stroke-width="1">
  <line x1="200" y1="520" x2="400" y2="520"/><line x1="200" y1="570" x2="400" y2="570"/>
  <line x1="200" y1="620" x2="400" y2="620"/>
</g>
<g fill="#d6b25e">
  <circle cx="228" cy="495" r="3"/><circle cx="272" cy="495" r="3"/><circle cx="316" cy="495" r="3"/>
  <circle cx="360" cy="495" r="3"/>
  <circle cx="228" cy="545" r="3"/><circle cx="272" cy="545" r="3"/><circle cx="316" cy="545" r="3"/>
  <circle cx="360" cy="545" r="3"/>
  <circle cx="228" cy="595" r="3"/><circle cx="272" cy="595" r="3"/><circle cx="316" cy="595" r="3"/>
  <circle cx="360" cy="595" r="3"/>
  <circle cx="228" cy="645" r="3"/><circle cx="272" cy="645" r="3"/><circle cx="316" cy="645" r="3"/>
  <circle cx="360" cy="645" r="3"/>
</g>
<!-- the reach that sets the size -->
<g stroke="#9fbfa4" stroke-width="0.9" stroke-dasharray="4 5">
  <line x1="176" y1="720" x2="424" y2="720"/>
</g>
<text x="300" y="742" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#9fbfa4">two metres, and a path on every side</text>

<text x="300" y="838" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#9fbfa4">What went in, what came up, and what it taught.</text>

<g text-anchor="middle" font-family="Georgia, serif">
  <text x="300" y="884" font-size="20" letter-spacing="9" fill="#e8eee3">VOLUME ONE</text>
  <text x="300" y="903" font-size="10" letter-spacing="5" fill="#9fbfa4">WORKING NOTES &#183; EXAMPLE PRESS</text>
</g>

<rect x="20" y="53" width="560" height="860" fill="none" stroke="#3f6b44" stroke-width="1.3" opacity="0.9"/>
<rect x="26" y="59" width="548" height="848" fill="none" stroke="#3f6b44" stroke-width="0.6" opacity="0.55"/>
</svg>
